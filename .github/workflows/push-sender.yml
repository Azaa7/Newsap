name: Push Sender Cron

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

jobs:
  send-push:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install runtime dependencies
        run: npm install --no-save firebase-admin expo-server-sdk

      - name: Send push for latest article
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_PROJECT_ID: newsap-c16ac
        run: node scripts/pushSenderCron.js
